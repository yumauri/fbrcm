version: 2

project_name: fbrcm

before:
  hooks:
    - go mod tidy
    - go run ./cmd/genoauthclient
    - mkdir -p completions
    - sh -c 'go run . completion bash > completions/fbrcm.bash'
    - sh -c 'go run . completion zsh > completions/fbrcm.zsh'
    - sh -c 'go run . completion fish > completions/fbrcm.fish'

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./
    tags:
      - fbrcm_google_auth
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - completions/*
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: fbrcm
    repository:
      owner: yumauri
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/yumauri/fbrcm"
    description: "Firebase Remote Config Management"
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fbrcm"]
          end
    completions:
      bash: "completions/fbrcm.bash"
      zsh: "completions/fbrcm.zsh"
      fish: "completions/fbrcm.fish"

scoops:
  - repository:
      owner: yumauri
      name: scoop-bucket
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
    homepage: "https://github.com/yumauri/fbrcm"
    description: "Firebase Remote Config Management"
    license: MIT
