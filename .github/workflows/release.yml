name: Release

on:
  push:
    tags:
      - "v*" # matches v1.0.0, v2.3.1, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate OAuth release credentials
        shell: bash
        env:
          FBRCM_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FBRCM_GOOGLE_OAUTH_CLIENT_ID }}
          FBRCM_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.FBRCM_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          for credential in FBRCM_GOOGLE_OAUTH_CLIENT_ID FBRCM_GOOGLE_OAUTH_CLIENT_SECRET; do
            credential_value="${!credential-}"
            if [[ -z "${credential_value//[[:space:]]/}" ]]; then
              echo "::error::Required release secret $credential is missing or empty."
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Generate machine contract
        run: go run ./cmd/schemagen

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Lint E2E
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: e2e

      - name: Vet
        run: go vet ./...

      - name: Vet E2E
        working-directory: e2e
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test E2E (replay)
        working-directory: e2e
        run: go test -count=1 ./...

      - name: Verify OAuth release build
        env:
          FBRCM_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FBRCM_GOOGLE_OAUTH_CLIENT_ID }}
          FBRCM_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.FBRCM_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          go run ./cmd/genoauthclient
          go run ./cmd/gennotices -tags fbrcm_google_auth -check
          go build -tags=fbrcm_google_auth -o "${RUNNER_TEMP}/fbrcm-oauth-check" .
          go run ./cmd/genoauthclient -verify "${RUNNER_TEMP}/fbrcm-oauth-check"

      - name: Remove preflight OAuth client source
        if: always()
        run: go run ./cmd/genoauthclient -clean

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}
          FBRCM_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FBRCM_GOOGLE_OAUTH_CLIENT_ID }}
          FBRCM_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.FBRCM_GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Remove release OAuth client source
        if: always()
        run: go run ./cmd/genoauthclient -clean
