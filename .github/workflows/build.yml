name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Generate machine contract
        run: go run ./cmd/schemagen

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Verify release third-party notices
        run: |
          go run ./cmd/genoauthclient
          trap 'go run ./cmd/genoauthclient -clean' EXIT
          go run ./cmd/gennotices -tags fbrcm_google_auth -check

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Lint E2E
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: e2e

      - name: Vet
        run: go vet ./...

      - name: Vet E2E
        working-directory: e2e
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test E2E (replay)
        working-directory: e2e
        run: go test -count=1 ./...

      - name: Build snapshot (GoReleaser dry-run)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.19.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FBRCM_GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
          FBRCM_GOOGLE_OAUTH_CLIENT_SECRET: ci-test-client-secret

      - name: Verify snapshot does not expose plaintext OAuth credentials
        env:
          FBRCM_GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
          FBRCM_GOOGLE_OAUTH_CLIENT_SECRET: ci-test-client-secret
        run: go run ./cmd/genoauthclient -verify dist

      - name: Verify snapshot contains third-party notices
        run: |
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | while IFS= read -r -d '' archive; do
            case "$archive" in
              *.zip) unzip -l "$archive" | grep 'THIRD_PARTY_NOTICES' > /dev/null ;;
              *) tar -tzf "$archive" | grep 'THIRD_PARTY_NOTICES' > /dev/null ;;
            esac
          done

      - name: Remove generated OAuth client source
        if: always()
        run: go run ./cmd/genoauthclient -clean
