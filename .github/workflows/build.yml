name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate machine contract
        run: go run ./cmd/schemagen

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build snapshot (GoReleaser dry-run)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FBRCM_GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
          FBRCM_GOOGLE_OAUTH_CLIENT_SECRET: ci-test-client-secret

      - name: Verify snapshot does not expose plaintext OAuth credentials
        env:
          FBRCM_GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
          FBRCM_GOOGLE_OAUTH_CLIENT_SECRET: ci-test-client-secret
        run: go run ./cmd/genoauthclient -verify dist

      - name: Remove generated OAuth client source
        if: always()
        run: go run ./cmd/genoauthclient -clean
