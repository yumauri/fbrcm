<svg xmlns="http://www.w3.org/2000/svg" width="115" height="30" viewBox="0 0 115 30">
  <title>fbrcm</title>
  <style>
    .letter {
        opacity: 0;
        animation-duration: 1.6s;
        animation-fill-mode: forwards;
        animation-timing-function: steps(1, end);
    }

    .letter-f { animation-name: reveal-f; }
    .letter-b { animation-name: reveal-b; }
    .letter-r { animation-name: reveal-r; }
    .letter-c { animation-name: reveal-c; }
    .letter-m { animation-name: reveal-m; }

    .cursor {
        transform: translateX(-86px);
        animation: move-cursor 1.6s steps(1, end) forwards;
    }

    @keyframes reveal-f {
        0%, 62.49% { opacity: 0; }
        62.5%, 100% { opacity: 1; }
    }

    @keyframes reveal-b {
        0%, 69.36% { opacity: 0; }
        69.375%, 100% { opacity: 1; }
    }

    @keyframes reveal-r {
        0%, 78.42% { opacity: 0; }
        78.4375%, 100% { opacity: 1; }
    }

    @keyframes reveal-c {
        0%, 84.05% { opacity: 0; }
        84.0625%, 100% { opacity: 1; }
    }

    @keyframes reveal-m {
        0%, 92.49% { opacity: 0; }
        92.5%, 100% { opacity: 1; }
    }

    @keyframes move-cursor {
        0%, 62.49% { transform: translateX(-86px); }
        62.5%, 69.36% { transform: translateX(-70px); }
        69.375%, 78.42% { transform: translateX(-54px); }
        78.4375%, 84.05% { transform: translateX(-44px); }
        84.0625%, 92.49% { transform: translateX(-28px); }
        92.5%, 100% { transform: translateX(0); }
    }

    /* @media (prefers-reduced-motion: reduce) {
        .letter {
            opacity: 1;
            animation: none;
        }

        .cursor {
            transform: translateX(0);
            animation: none;
        }
    } */
  </style>

